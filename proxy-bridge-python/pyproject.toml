[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmstudio-test-cli"
version = "0.1.0"
description = "Interactive CLI testing and benchmarking tool for LMStudio proxy bridge"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.24",
]

[project.scripts]
lmstudio-test = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]
